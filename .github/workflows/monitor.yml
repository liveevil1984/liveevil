name: Keyword Monitor

on:
  schedule:
    # All times below are UTC. Singapore time is UTC+8, so these run at
    # roughly 08:00, 11:00, 14:00, 17:00, 20:00 and 23:00 SGT (~6x/day).
    - cron: "0 0 * * *"  # 08:00 SGT
    - cron: "0 3 * * *"  # 11:00 SGT
    - cron: "0 6 * * *"  # 14:00 SGT
    - cron: "0 9 * * *"  # 17:00 SGT
    - cron: "0 12 * * *" # 20:00 SGT
    - cron: "0 15 * * *" # 23:00 SGT
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: keyword-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update monitor state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
